schema: socialname.dev/site/v1
id: twitter
name: Twitter
homepage: https://x.com/
profile_url: https://x.com/{username:path}
namespace: person
username:
  pattern: ^[a-zA-Z0-9_]{1,15}$
  case_sensitive: false
  normalization: preserve
probes:
- id: profile
  http:
    method: GET
    url: https://nitter.privacydev.net/{username:path}
    redirects:
      mode: same_site
      max_hops: 2
    timeout:
      dns_ms: 1500
      connect_ms: 2000
      first_byte_ms: 4000
      total_ms: 6000
    allowed_hosts:
    - nitter.privacydev.net
    headers: {}
    body: null
    expected_body: bounded_text
    limits:
      header_bytes: 32768
      compressed_bytes: 2097152
      decompressed_bytes: 4194304
      inspected_bytes: 262144
    transport_profile: browser_like
plan:
  type: single
  probe: profile
classification:
  blocked:
    any:
    - status:
        probe: profile
        in:
        - 403
        - 429
    - transport:
        probe: profile
        in:
        - blocked
        - rate_limited
        - timeout
        - dns
        - connect
        - tls
        - redirect_rejected
        - response_too_large
        - decode
  found:
    all:
    - status:
        probe: profile
        in:
        - 200
    - not:
        any:
        - body:
            probe: profile
            op: contains
            value: '<div class="error-panel"><span>User '
        - body:
            probe: profile
            op: contains
            value: <title>429 Too Many Requests</title>
  not_found:
    any:
    - body:
        probe: profile
        op: contains
        value: '<div class="error-panel"><span>User '
    - body:
        probe: profile
        op: contains
        value: <title>429 Too Many Requests</title>
  otherwise: inconclusive
metadata:
  enabled: false
  enabled_regions: []
  tags:
  - imported
  - check-message
  adult: false
  notes: Imported from the Sherlock project (MIT) using its message check. Discovery-only until the live canary gate passes.
