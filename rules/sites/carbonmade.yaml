schema: socialname.dev/site/v1
id: carbonmade
name: Carbonmade
homepage: https://carbonmade.com/
profile_url: https://{username:subdomain}.carbonmade.com
namespace: person
username:
  pattern: ^[\w@-]+?$
  case_sensitive: false
  normalization: preserve
probes:
- id: profile
  http:
    method: GET
    url: https://{username:subdomain}.carbonmade.com
    redirects:
      mode: follow
      max_hops: 3
    timeout:
      dns_ms: 1500
      connect_ms: 2000
      first_byte_ms: 4000
      total_ms: 6000
    allowed_hosts:
    - '*.carbonmade.com'
    - carbonmade.com
    headers: {}
    body: null
    expected_body: none
    limits:
      header_bytes: 32768
      compressed_bytes: 2097152
      decompressed_bytes: 4194304
      inspected_bytes: 262144
    transport_profile: browser_like
plan:
  type: single
  probe: profile
classification:
  blocked:
    any:
    - status:
        probe: profile
        in:
        - 403
        - 429
    - transport:
        probe: profile
        in:
        - blocked
        - rate_limited
        - timeout
        - dns
        - connect
        - tls
        - redirect_rejected
        - response_too_large
        - decode
  found:
    all:
    - status:
        probe: profile
        in:
        - 200
    - not:
        final_url:
          probe: profile
          op: prefix
          value: https://carbonmade.com/fourohfour?domain={}.carbonmade.com
  not_found:
    final_url:
      probe: profile
      op: prefix
      value: https://carbonmade.com/fourohfour?domain={}.carbonmade.com
  otherwise: inconclusive
metadata:
  enabled: false
  enabled_regions: []
  tags:
  - imported
  - check-response-url
  adult: false
  notes: Imported from the Sherlock project (MIT) using its response_url check. Discovery-only until the live canary gate passes.
