schema: socialname.dev/site/v1
id: npm
name: npm
homepage: https://www.npmjs.com/
profile_url: https://www.npmjs.com/~{username:path}
namespace: developer_account
username:
  pattern: '^[a-z\d][a-z\d._-]{0,63}$'
  case_sensitive: false
  normalization: lowercase
probes:
  - id: profile
    http:
      method: GET
      url: https://www.npmjs.com/~{username:path}
      redirects:
        mode: same_site
        max_hops: 2
      allowed_hosts: [www.npmjs.com]
      headers:
        accept: text/html
      expected_body: bounded_text
      transport_profile: browser_like
plan:
  type: single
  probe: profile
classification:
  blocked:
    any:
      - status:
          probe: profile
          in: [403, 429]
      - transport:
          probe: profile
          in: [blocked, rate_limited, timeout, dns, connect, tls, redirect_rejected, response_too_large, decode]
  found:
    all:
      - status:
          probe: profile
          in: [200]
      - body:
          probe: profile
          op: contains_template
          value: '/~{username}'
  not_found:
    status:
      probe: profile
      in: [404]
  otherwise: inconclusive
metadata:
  enabled: false
  enabled_regions: []
  tags: [developer, package-registry, html]
  notes: >-
    Disabled because npm currently has no dependable public existence signal.
    Measured 2026-07-30. The profile page this rule reads is bot-protected and
    starts returning 403 after modest probing, which the rule correctly
    reports as blocked rather than as absence. The registry user endpoint
    requires authentication. The public search API answers a different
    question: maintainer:<name> returns zero results for a real account that
    has published nothing, so treating it as existence would report a live
    account as absent. Promotion waits for a signal that distinguishes
    account existence, not for a workaround that guesses.
