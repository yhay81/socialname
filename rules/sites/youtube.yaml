schema: socialname.dev/site/v1
id: youtube
name: YouTube
homepage: https://www.youtube.com/
profile_url: https://www.youtube.com/@{username:path}
namespace: channel
username:
  pattern: '^[A-Za-z\d._-]{3,30}$'
  case_sensitive: false
  normalization: preserve
probes:
  - id: handle
    http:
      method: GET
      url: https://www.youtube.com/@{username:path}
      redirects:
        mode: same_site
        max_hops: 2
      allowed_hosts: [www.youtube.com]
      headers:
        accept: text/html
      expected_body: bounded_text
      transport_profile: browser_like
plan:
  type: single
  probe: handle
classification:
  blocked:
    any:
      - status:
          probe: handle
          in: [403, 429]
      - transport:
          probe: handle
          in: [blocked, rate_limited, timeout, dns, connect, tls, redirect_rejected, response_too_large, decode]
  found:
    all:
      - status:
          probe: handle
          in: [200]
      - body:
          probe: handle
          op: contains_template
          value: 'https://www.youtube.com/@{username}'
  not_found:
    status:
      probe: handle
      in: [404]
  otherwise: inconclusive
canary:
  found: [YouTube]
  not_found:
    generator:
      alphabet: lowercase_alnum
      length: 30
      attempts: 3
metadata:
  enabled: false
  enabled_regions: []
  tags: [video, channel, html]
  notes: Disabled until consent-page and localized-response behavior are continuously distinguished from not-found.
