[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/socialname-app-core",
    "crates/socialname-canary",
    "crates/socialname-cache",
    "crates/socialname-cli",
    "crates/socialname-domain",
    "crates/socialname-engine",
    "crates/socialname-protocol",
    "crates/socialname-rule-compiler",
    "crates/socialname-rule-schema",
    "crates/socialname-server",
    "crates/socialname-testkit",
    "crates/socialname-worker",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["SocialName contributors"]
license = "MIT"
repository = "https://github.com/yhay81/socialname"

[workspace.dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
brotli = "9.1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "brotli",
    "deflate",
    "form",
    "gzip",
    "http2",
    "json",
    "rustls",
    "stream",
    "zstd",
] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "sqlite",
    # Managed PostgreSQL endpoints (for example Neon) require TLS; rustls
    # matches the engine's existing TLS stack and honors SSL_CERT_FILE.
    "tls-rustls-ring",
    "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
zeroize = "1.9.1"
zstd = "0.14.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Tauri v2's Linux GTK3 backend is pinned to glib 0.18. The published 0.18.5
# crate contains RUSTSEC-2024-0429 and no compatible fixed release exists yet.
# This checksum-verified local source carries only the upstream two-character
# soundness fix; provenance is recorded beside the vendored crate.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
# SQLx 0.9.0 needs upstream PR #4502 to build with the fixed bundled SQLite.
sqlx-sqlite = { path = "vendor/sqlx-sqlite-0.9.0" }
