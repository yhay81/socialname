name: API

# Verifies and deploys the managed API server — the Worker + Container in
# deploy/api wrapping deploy/server/Dockerfile — to api.socialname.net.
#
# Verification runs on every change without credentials. Deployment runs only
# on main and only when the Cloudflare credentials exist, mirroring site.yml,
# so a fork or an unconfigured repository still gets the check without a
# broken deploy. When the schema-owner database URL secret exists, embedded
# migrations run first through the published server image. Runtime secrets
# reach the Worker through `wrangler secret put` and are never echoed.

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the Worker configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Type-check the Worker
        run: npm run check

      - name: Dry-run the deployment without a container build
        run: npx wrangler deploy --dry-run --containers-rollout=none

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_MIGRATE_URL: ${{ secrets.SOCIALNAME_MIGRATE_DATABASE_URL != '' }}
      HAS_SERVER_URL: ${{ secrets.SOCIALNAME_SERVER_DATABASE_URL != '' }}
      HAS_ROLE_PASSWORDS: ${{ secrets.SOCIALNAME_APPLICATION_ROLE_PASSWORD != '' && secrets.SOCIALNAME_WORKER_ROLE_PASSWORD != '' }}
      HAS_HMAC_KEY: ${{ secrets.SOCIALNAME_SUPPRESSION_HMAC_KEY_HEX != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Report missing credentials
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping deployment."

      - name: Apply embedded migrations through the published server image
        if: env.HAS_CLOUDFLARE == 'true' && env.HAS_MIGRATE_URL == 'true'
        env:
          SOCIALNAME_DATABASE_URL: ${{ secrets.SOCIALNAME_MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm \
            --env SOCIALNAME_DATABASE_URL \
            "ghcr.io/${{ github.repository_owner }}/socialname-server:main" migrate

      - name: Provision the runtime database roles
        if: env.HAS_CLOUDFLARE == 'true' && env.HAS_MIGRATE_URL == 'true' && env.HAS_ROLE_PASSWORDS == 'true'
        env:
          SOCIALNAME_DATABASE_URL: ${{ secrets.SOCIALNAME_MIGRATE_DATABASE_URL }}
          SOCIALNAME_APPLICATION_ROLE_PASSWORD: ${{ secrets.SOCIALNAME_APPLICATION_ROLE_PASSWORD }}
          SOCIALNAME_WORKER_ROLE_PASSWORD: ${{ secrets.SOCIALNAME_WORKER_ROLE_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm \
            --env SOCIALNAME_DATABASE_URL \
            --env SOCIALNAME_APPLICATION_ROLE_PASSWORD \
            --env SOCIALNAME_WORKER_ROLE_PASSWORD \
            "ghcr.io/${{ github.repository_owner }}/socialname-server:main" provision-roles

      - uses: actions/setup-node@v6
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/api/package-lock.json

      - name: Install Worker dependencies
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: deploy/api
        run: npm ci

      - name: Set the runtime database secret
        if: env.HAS_CLOUDFLARE == 'true' && (env.HAS_SERVER_URL == 'true' || (env.HAS_MIGRATE_URL == 'true' && env.HAS_ROLE_PASSWORDS == 'true'))
        working-directory: deploy/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPLICIT_URL: ${{ secrets.SOCIALNAME_SERVER_DATABASE_URL }}
          MIGRATE_URL: ${{ secrets.SOCIALNAME_MIGRATE_DATABASE_URL }}
          APPLICATION_ROLE_PASSWORD: ${{ secrets.SOCIALNAME_APPLICATION_ROLE_PASSWORD }}
        run: |
          set -euo pipefail
          # An explicit runtime URL wins; otherwise derive it from the
          # schema-owner URL's host part and the generated hex password of
          # the default socialname_app role. Nothing is echoed.
          if [ -n "$EXPLICIT_URL" ]; then
            value="$EXPLICIT_URL"
          else
            # URL setters percent-encode reserved password characters. String
            # concatenation would turn values containing @, :, /, ?, or #
            # into a different and usually invalid PostgreSQL URL.
            value="$(node <<'NODE'
          const url = new URL(process.env.MIGRATE_URL);
          if (url.protocol !== "postgres:" && url.protocol !== "postgresql:") {
            throw new Error("SOCIALNAME_MIGRATE_DATABASE_URL is not PostgreSQL");
          }
          url.username = "socialname_app";
          url.password = process.env.APPLICATION_ROLE_PASSWORD;
          process.stdout.write(url.toString());
          NODE
            )"
          fi
          printf '%s' "$value" | npx wrangler secret put SOCIALNAME_SERVER_DATABASE_URL

      - name: Set the suppression key secret
        if: env.HAS_CLOUDFLARE == 'true' && env.HAS_HMAC_KEY == 'true'
        working-directory: deploy/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.SOCIALNAME_SUPPRESSION_HMAC_KEY_HEX }}
        run: printf '%s' "$SECRET_VALUE" | npx wrangler secret put SOCIALNAME_SUPPRESSION_HMAC_KEY_HEX

      - name: Verify the runtime database credentials
        if: env.HAS_HMAC_KEY == 'true' && (env.HAS_SERVER_URL == 'true' || (env.HAS_MIGRATE_URL == 'true' && env.HAS_ROLE_PASSWORDS == 'true'))
        env:
          EXPLICIT_URL: ${{ secrets.SOCIALNAME_SERVER_DATABASE_URL }}
          MIGRATE_URL: ${{ secrets.SOCIALNAME_MIGRATE_DATABASE_URL }}
          APPLICATION_ROLE_PASSWORD: ${{ secrets.SOCIALNAME_APPLICATION_ROLE_PASSWORD }}
          SOCIALNAME_SUPPRESSION_HMAC_KEY_HEX: ${{ secrets.SOCIALNAME_SUPPRESSION_HMAC_KEY_HEX }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT_URL" ]; then
            SOCIALNAME_SERVER_DATABASE_URL="$EXPLICIT_URL"
          else
            SOCIALNAME_SERVER_DATABASE_URL="$(node <<'NODE'
          const url = new URL(process.env.MIGRATE_URL);
          if (url.protocol !== "postgres:" && url.protocol !== "postgresql:") {
            throw new Error("SOCIALNAME_MIGRATE_DATABASE_URL is not PostgreSQL");
          }
          url.username = "socialname_app";
          url.password = process.env.APPLICATION_ROLE_PASSWORD;
          process.stdout.write(url.toString());
          NODE
            )"
          fi
          export SOCIALNAME_SERVER_DATABASE_URL
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          smoke_container="socialname-api-runtime-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --rm \
            --name "$smoke_container" \
            --publish 127.0.0.1:18080:8080 \
            --env SOCIALNAME_SERVER_DATABASE_URL \
            --env SOCIALNAME_SUPPRESSION_HMAC_KEY_HEX \
            "ghcr.io/${{ github.repository_owner }}/socialname-server:main"
          trap 'docker stop "$smoke_container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              echo "runtime database readiness passed"
              exit 0
            fi
            sleep 1
          done
          echo "::error::runtime database readiness did not pass within 30 seconds"
          exit 1

      # Secrets are synchronized before deployment so a route-permission or
      # container-rollout failure cannot leave production on stale runtime
      # credentials after database roles have already been rotated.
      - name: Deploy the Worker and container image
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: deploy/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --containers-rollout=immediate
