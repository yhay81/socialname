name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    env:
      SOCIALNAME_DATABASE_URL: postgres://postgres:postgres@localhost:5432/socialname_test
      SOCIALNAME_TEST_APPLICATION_DATABASE_URL: postgres://socialname_migration_test_app:socialname-test-password@localhost:5432/socialname_test
      SOCIALNAME_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/socialname_test
      SOCIALNAME_TEST_WORKER_DATABASE_URL: postgres://socialname_migration_test_worker:socialname-worker-test-password@localhost:5432/socialname_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: socialname_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialname_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --exclude socialname-desktop --all-targets --all-features -- -D warnings

      - name: Verify API v1 contracts
        run: cargo run --locked -p socialname-protocol --bin socialname-api-contract -- check

      - name: Verify API v1 examples
        run: node --test examples/api-v1/client.test.mjs

      - name: Apply PostgreSQL migrations
        run: cargo run --locked -p socialname-server -- migrate

      - name: Run tests
        run: cargo test --locked --workspace --exclude socialname-desktop --all-targets

      - name: Validate Site Rule v1 pack
        run: cargo run --locked -p socialname-cli -- rules validate

      - name: Validate canary manifests
        run: cargo run --locked -p socialname-cli -- canaries validate

      - name: Verify deterministic site fixtures
        run: cargo run --locked -p socialname-cli -- fixtures

  deployed-postgres:
    name: PostgreSQL 17 integration
    # The managed deployment runs PostgreSQL 17 while the core job runs 18.
    # Running the schema and isolation gate against both keeps the tested
    # configuration and the deployed one the same thing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOCIALNAME_DATABASE_URL: postgres://postgres:postgres@localhost:5432/socialname_test
      SOCIALNAME_TEST_APPLICATION_DATABASE_URL: postgres://socialname_migration_test_app:socialname-test-password@localhost:5432/socialname_test
      SOCIALNAME_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/socialname_test
      SOCIALNAME_TEST_WORKER_DATABASE_URL: postgres://socialname_migration_test_worker:socialname-worker-test-password@localhost:5432/socialname_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialname_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialname_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Apply PostgreSQL migrations
        run: cargo run --locked -p socialname-server -- migrate

      - name: Run the PostgreSQL integration gate
        run: cargo test --locked -p socialname-server --test postgres_migrations

  worker-image:
    name: Managed worker OCI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build managed worker image
        run: >-
          docker build
          --file deploy/worker/Dockerfile
          --tag socialname-worker
          --build-arg VCS_REF=${{ github.sha }}
          .

      - name: Verify managed worker image
        shell: bash
        run: |
          set -euo pipefail
          runtime_flags=(
            --rm
            --network none
            --read-only
            --cap-drop ALL
            --security-opt no-new-privileges=true
          )
          docker run "${runtime_flags[@]}" socialname-worker --help
          test "$(docker image inspect socialname-worker --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect socialname-worker --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/socialname-worker"]'
          test "$(docker image inspect socialname-worker --format '{{.Config.StopSignal}}')" = "SIGTERM"
          test "$(docker run "${runtime_flags[@]}" --entrypoint /usr/bin/id socialname-worker -u)" = "10001"
          docker run "${runtime_flags[@]}" --entrypoint /bin/sh socialname-worker \
            -c 'test -r /opt/socialname/rules/sites/github.yaml'

          set +e
          output="$(
            docker run "${runtime_flags[@]}" socialname-worker process-one \
              --site github \
              --region test-region \
              --rules-dir /opt/socialname/rules/sites \
              --metadata /missing/metadata.json \
              --current-trust-file /missing/trust.json \
              --minimum-metadata-sequence-exclusive 0 \
              --worker-id test-region-worker 2>&1
          )"
          status="$?"
          set -e
          test "$status" -ne 0
          test "$output" = "managed_worker_error=managed job processing requires --allow-live"

      - name: Publish managed worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/socialname-worker"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag socialname-worker "${image}:sha-${{ github.sha }}"
          docker tag socialname-worker "${image}:main"
          docker push "${image}:sha-${{ github.sha }}"
          docker push "${image}:main"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:sha-${{ github.sha }}")"
          {
            echo "## Managed worker image"
            echo ""
            echo "- source revision: \`${{ github.sha }}\`"
            echo "- immutable digest: \`${digest}\`"
            echo ""
            echo "Deployments must pin this digest, not a mutable tag."
          } >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: API server OCI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build API server image
        run: >-
          docker build
          --file deploy/server/Dockerfile
          --tag socialname-server
          --build-arg VCS_REF=${{ github.sha }}
          .

      - name: Verify API server image
        shell: bash
        run: |
          set -euo pipefail
          runtime_flags=(
            --rm
            --network none
            --read-only
            --cap-drop ALL
            --security-opt no-new-privileges=true
          )
          test "$(docker image inspect socialname-server --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect socialname-server --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/socialname-server"]'
          test "$(docker image inspect socialname-server --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker run "${runtime_flags[@]}" --entrypoint /bin/sh socialname-server \
            -c 'test -r /opt/socialname/console/index.html'

          # The operator surface is closed: arbitrary arguments, including
          # --help, must be rejected without echoing them back.
          set +e
          help_output="$(docker run "${runtime_flags[@]}" socialname-server --help 2>&1)"
          help_status="$?"
          set -e
          test "$help_status" -ne 0
          test "$help_output" = "Error: CommandError"

          # Serving without database configuration must fail closed before
          # listening instead of starting a half-configured server.
          set +e
          timeout 30 docker run "${runtime_flags[@]}" socialname-server >/dev/null 2>&1
          serve_status="$?"
          set -e
          test "$serve_status" -ne 0
          test "$serve_status" -ne 124

      - name: Publish API server image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/socialname-server"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag socialname-server "${image}:sha-${{ github.sha }}"
          docker tag socialname-server "${image}:main"
          docker push "${image}:sha-${{ github.sha }}"
          docker push "${image}:main"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:sha-${{ github.sha }}")"
          {
            echo "## API server image"
            echo ""
            echo "- source revision: \`${{ github.sha }}\`"
            echo "- immutable digest: \`${digest}\`"
            echo ""
            echo "Deployments must pin this digest, not a mutable tag."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build desktop application
        run: npm run tauri -- build --debug --no-bundle --ci

      - name: Run desktop Clippy
        working-directory: ${{ github.workspace }}
        run: cargo clippy --locked -p socialname-desktop --all-targets -- -D warnings

  console:
    name: Monitoring console
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/console

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install console dependencies
        run: npm ci

      - name: Test console model
        run: npm test

      - name: Check console
        run: npm run check

      - name: Build console
        run: npm run build
