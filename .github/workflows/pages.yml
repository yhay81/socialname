name: Pages

# Publishes the static landing page in web/ to GitHub Pages. The page is
# dependency-free: no build step, no bundler, no third-party request at
# runtime, so what is committed is exactly what is served.

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the page is self-contained
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Reject external runtime references
        run: |
          set -euo pipefail
          # A landing page that silently loads a font, a script, or a tracker
          # from another origin would contradict the privacy claim it makes.
          if grep -nEi 'src="https?://|href="https?://[^"]*\.(css|js)|<script' web/*.html; then
            echo "web/ must not reference external scripts, styles, or fonts" >&2
            exit 1
          fi
          for asset in $(grep -oE '(href|src)="[^"#][^"]*"' web/index.html \
              | sed -E 's/^(href|src)="//; s/"$//' \
              | grep -vE '^(https?:|mailto:|#)'); do
            test -f "web/${asset}" || {
              echo "web/index.html references missing local asset ${asset}" >&2
              exit 1
            }
          done
          echo "landing page references only committed local assets"

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
